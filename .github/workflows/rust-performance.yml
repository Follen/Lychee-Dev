name: Rust paired performance (explicit opt-in)

# Separate from correctness/dev-profile CI. A marker is required on push;
# manual dispatch is itself explicit. Never a release/publish/game workflow.
on:
  push:
    branches: [rust-refactor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-paired-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selected-paired-performance:
    if: github.ref == 'refs/heads/rust-refactor' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rust-performance]'))
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Checkout the exact independent Go 3.2.4 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '29bdbdaff5f064ec212ff2064380b1ccac652eda'
          path: '.tmp/paired-go-3.2.4-source'
          fetch-depth: 1
          persist-credentials: false
      - name: Check Node assertions and real native timing/ownership
        run: node --test tests/rust-performance-paired/runner.test.mjs tools/rust-owned-process.test.mjs
      - name: Prepare official pinned Rust and unmodified Emmy
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python third_party/emmy/prepare.py --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python third_party/emmy/prepare.py --check
          exit $LASTEXITCODE
      - name: Prepare dependency downloads outside measured work
        run: node tools/rust-cargo.mjs --owner paired-fetch -- fetch --locked
      - name: Build optimized Rust through the existing controlled channel
        run: |
          Remove-Item Env:RUSTFLAGS -ErrorAction SilentlyContinue
          Remove-Item Env:CARGO_ENCODED_RUSTFLAGS -ErrorAction SilentlyContinue
          node tools/rust-build.mjs .tmp/paired-rust-artifact release
          exit $LASTEXITCODE
      - name: Download and authenticate fixed LuaLS input separately
        run: |
          New-Item -ItemType Directory -Force .tmp/paired-bootstrap | Out-Null
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $url = 'https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-win32-x64.zip'
          $archive = '.tmp/paired-bootstrap/luals-3.19.1.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $clock.Stop()
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ((Get-Item $archive).Length -ne 4453980 -or $hash -ne 'fdb9a59108cf62517813c97fa5549b0e16d1ef0688306bac728b08434db7e4cd') { throw 'fixed LuaLS archive identity differs' }
          @{schema='lycheedev.performance-preparation.v1';phase='LuaLS input download';url=$url;bytes=4453980;sha256=$hash;wallMillis=$clock.Elapsed.TotalMilliseconds;benchmarkSubtraction=$false} | ConvertTo-Json | Set-Content -Encoding utf8 .tmp/paired-bootstrap/download.json
      - name: Build verified private Go package under owned Job
        run: |
          $npm = Join-Path (Split-Path (Get-Command node).Source) 'node_modules/npm/bin/npm-cli.js'
          if (!(Test-Path -LiteralPath $npm)) { throw 'official installed npm CLI unavailable' }
          node tools/rust-performance-prepare-go.mjs .tmp/paired-go-3.2.4-source .tmp/paired-bootstrap/luals-3.19.1.zip $npm .tmp/paired-go-3.2.4-artifact
          exit $LASTEXITCODE
      - name: Record hosted-machine limitations without a manual gate
        run: |
          @{machine="GitHub hosted windows-2025 VM; runner=$env:RUNNER_NAME; run=$env:GITHUB_RUN_ID";powerAndThermal='Power scheme captured by powercfg before and after; host thermal/turbo state unknown';competingLoad='Job is sequential; colocated host load unknown and not asserted controlled';disk='Same runner workspace volume for both engines; physical backing/storage contention unknown';operator='Explicit rust-performance marker or workflow_dispatch'} | ConvertTo-Json | Set-Content -Encoding utf8 .tmp/paired-bootstrap/machine-conditions.json
      - name: Run 20 independent cold plus warm pairs per selected path
        run: |
          node tools/rust-performance-paired.mjs .tmp/paired-rust-artifact/artifact.json .tmp/paired-go-3.2.4-source .tmp/paired-go-3.2.4-artifact/dev-npm-stage .tmp/paired-bootstrap/luals-3.19.1.zip .tmp/paired-bootstrap/machine-conditions.json
          exit $LASTEXITCODE
      - name: Preserve every sealed report and failed owned fixture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-paired-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .tmp/rust-disk/evidence/
            .tmp/rust-scratch/
            .tmp/paired-bootstrap/
            .tmp/paired-rust-artifact/
            .tmp/paired-go-3.2.4-artifact/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
