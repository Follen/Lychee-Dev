name: Rust mailbox fixed Go golden oracle
on:
  push:
    branches: [rust-refactor]
    paths:
      - tests/rust-parity/mailbox-journal-golden.*
      - .github/workflows/rust-mailbox-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-generated-golden:
    if: github.ref == 'refs/heads/rust-refactor'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Generate with the fixed release Go toolchain and compare values
        shell: pwsh
        env:
          GOTOOLCHAIN: local
        run: |
          $ErrorActionPreference = 'Stop'
          go version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run tests/rust-parity/mailbox-journal-golden.go | Out-File -Encoding utf8 mailbox-journal-generated.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; a=json.load(open('mailbox-journal-generated.json',encoding='utf-8-sig')); b=json.load(open('tests/rust-parity/mailbox-journal-golden.json',encoding='utf-8')); assert a==b, 'Go generated golden differs'"
          exit $LASTEXITCODE
      - name: Preserve actual Go output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mailbox-go-oracle-${{ github.sha }}
          path: mailbox-journal-generated.json
          if-no-files-found: warn
          retention-days: 14
