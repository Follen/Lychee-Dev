name: publish npm

# Publishing is triggered by a version tag such as v0.8.0. Nothing is published
# from a branch push, so `npm version` + `git push --follow-tags` is the only
# way a release reaches the registry.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and test only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vendor the shipped payload
        working-directory: packages/cli
        run: node scripts/vendor.mjs

      - name: Fail if the vendored registry ships local task data
        shell: bash
        run: |
          if grep -q '^-- BEGIN LYCHEE DEV TASK ' packages/cli/vendor/addon/Modules/Automation/auto/auto.lua; then
            echo "::error::the task registry contains local task blocks; clear it before releasing"
            exit 1
          fi

      - name: Package contents
        working-directory: packages/cli
        run: npm pack --dry-run

  addon-tests:
    name: addon test matrix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The runner has no Lua interpreter, and the suite is written for the
      # 5.1 subset the game uses. The archive ships lua5.1.exe, so it is copied
      # to the bare `lua` name the test runner invokes.
      - name: Install Lua 5.1
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'lua51'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'lua51.zip'
          curl.exe -sL --fail --max-time 300 -o $zip `
            "https://sourceforge.net/projects/luabinaries/files/5.1.5/Tools%20Executables/lua-5.1.5_Win64_bin.zip/download"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $toolDir)
          Copy-Item -LiteralPath (Join-Path $toolDir 'lua5.1.exe') `
            -Destination (Join-Path $toolDir 'lua.exe') -Force
          Copy-Item -LiteralPath (Join-Path $toolDir 'luac5.1.exe') `
            -Destination (Join-Path $toolDir 'luac.exe') -Force
          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $toolDir 'lua.exe') -v

      - name: Run the repository test matrix
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File add-on/tests/TestAll.ps1

  publish:
    name: publish to npm
    needs: [verify, addon-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry-run == false
    environment: npm
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). No npm token is used, so a
      # long-lived secret with 2FA bypass never has to exist.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1, which needs Node >= 22.14.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure an npm that supports trusted publishing
        run: |
          npm install --global npm@latest
          npm --version

      - name: Vendor the shipped payload
        working-directory: packages/cli
        run: node scripts/vendor.mjs

      - name: Check the tag matches package.json
        working-directory: packages/cli
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # No NODE_AUTH_TOKEN and no NPM_TOKEN: npm exchanges the GitHub OIDC token
      # for short-lived registry credentials. Provenance is attached automatically.
      - name: Publish
        working-directory: packages/cli
        run: npm publish --access public
