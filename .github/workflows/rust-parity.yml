name: Rust parity foundation (Windows)

# This branch has not converged with main; push coverage must not depend on a
# mergeable pull-request merge ref. No publishing, secrets or game interaction.
on:
  push:
    branches: [rust-refactor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-parity-${{ github.ref }}
  # Preserve the current owned build and terminal evidence; newer batches queue.
  cancel-in-progress: false

jobs:
  windows-static-parity:
    if: github.ref == 'refs/heads/rust-refactor'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify immutable Go oracle object
        run: |
          git cat-file -e '3057a9666ab078270b63c7f06de748069b0d1f4b^{commit}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the differential runner (not product parity)
        run: node --test tests/rust-parity/oracle.test.mjs crates/lycheedev-cli/tests/contract_metadata.test.mjs
      - name: Test unsafe inventory and enforce owned business guards
        run: |
          node --test tools/rust-unsafe-boundaries.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/rust-unsafe-boundaries.mjs --check
          exit $LASTEXITCODE
      - name: Authenticate source-derived fixture
        run: node tests/rust-parity/run.mjs --verify-fixture
      - name: Report actual parity gaps without allowlisting them
        run: |
          node tests/rust-parity/run.mjs --json | Out-File -Encoding utf8 rust-parity-report.json
          exit $LASTEXITCODE
      - name: Preserve parity report even when the candidate differs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-static-parity-${{ github.sha }}
          path: rust-parity-report.json
          if-no-files-found: warn
          retention-days: 14

  windows-product-foundation:
    # Deliberately no needs: static parity gaps must not suppress real builds.
    if: github.ref == 'refs/heads/rust-refactor'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install fixed official Rust toolchain
        id: rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -Vv
          cargo -V
      - name: Reconstruct and authenticate fixed public Emmy dependency
        id: emmy
        run: |
          python third_party/emmy/prepare.py --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python third_party/emmy/prepare.py --check
          exit $LASTEXITCODE
      - name: Test custody and controlled runner fixtures
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: node --test tools/rust-emmy-identity.test.mjs tools/rust-build.test.mjs
      - name: Test exact owned-process lifecycle and unknown-child rejection
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: node --test tools/rust-owned-process.test.mjs
      - name: Test bounded dependency preparation fixtures
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: python -m unittest discover -s third_party/emmy -p test_prepare.py
      - name: Fetch lockfile dependencies under ownership controls
        id: dependencies
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-fetch -- fetch --locked
      - name: Compile all workspace targets without executing game fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-check --one-shot -- check --locked --offline --workspace --all-targets -j 1
      - name: Run client metadata filesystem fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-client-fixtures --one-shot -- test --locked --offline -p lycheedev-core --lib client::tests -j 1
      - name: Run bounded installation selection fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-installation-selection --one-shot -- test --locked --offline -p lycheedev-core --lib installation_selection::tests -j 1
      - name: Run Delivery selection fixtures without installing addons
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-delivery-selection --one-shot -- test --locked --offline -p lycheedev-delivery --lib selection_tests -j 1
      - name: Run fake-window passive discovery fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-passive-fixtures --one-shot -- test --locked --offline -p lycheedev-live --lib passive::tests -j 1
      - name: Run public installation error envelope fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-installation-envelopes --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::installation_ -j 1
      - name: Run CLI contract metadata and arity unit fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-cli-contract --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev contract::tests -j 1
      - name: Run Source query admission unit fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-query-default --one-shot -- test --locked --offline -p lycheedev-source --lib public_query_defaults -j 1
      - name: Run formal Go mailbox v1 pure fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-mailbox-v1 --one-shot -- test --locked --offline -p lycheedev-live --lib go_mailbox_v1 -j 1
      - name: Run real local Data installation and catalog fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-data-installation --one-shot -- test --locked --offline -p lycheedev-data --test installed_parity --test local_domain_parity -j 1
      - name: Run target cancellation before symbolic resolution
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-target-cancellation --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::target_dispatch_preserves_invocation_cancellation_and_deadline -j 1
      - name: Build a sealed real CLI executable
        id: cli_binary
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-build.mjs .tmp/ci-cli-artifact dev --one-shot
      - name: Execute sealed CLI version help and describe
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-cli-smoke.mjs .tmp/ci-cli-artifact/artifact.json
      - name: Preserve each controlled command receipt and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-product-foundation-${{ github.sha }}
          path: |
            .tmp/rust-disk/evidence/
            .tmp/rust-process-test-*/
            .tmp/ci-cli-artifact/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  windows-emmy-context:
    env:
      # Nested upstream rust-toolchain.toml must not select moving stable.
      RUSTUP_TOOLCHAIN: '1.99.0'
    # Separate host/ownership channel: never reuse an unresolved local build lease.
    if: github.ref == 'refs/heads/rust-refactor'
    runs-on: windows-2025
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install fixed official Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
          exit $LASTEXITCODE
      - name: Reconstruct exact reviewed public source candidate
        run: |
          python third_party/emmy/prepare.py --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node third_party/emmy/check.mjs --verify
          exit $LASTEXITCODE
      - name: Fetch locked integration-test dependencies under ownership controls
        run: node third_party/emmy/check.mjs fetch --locked
      - name: Execute public context and cardinality integration tests
        run: node third_party/emmy/check.mjs test --offline --locked -p emmylua_code_analysis --test lychee_context --test lychee_cardinality --test lychee_checker_guards -j 1
      - name: Preserve exact recipe and owned execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-emmy-context-${{ github.sha }}
          path: .tmp/rust-disk/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
