name: Rust parity foundation (Windows)

# This branch has not converged with main; push coverage must not depend on a
# mergeable pull-request merge ref. No publishing, secrets or game interaction.
# Every push preserves work and runs fast checks. Add [rust-native] to a reviewed
# batch commit to run complete Windows/Emmy acceptance; dispatch is optional.
# Commit selection works on this branch without requiring workflow on main.
on:
  push:
    branches: [rust-refactor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-parity-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rust-native]')) && 'native' || 'fast' }}
  # Preserve the current owned build and terminal evidence; newer batches queue.
  cancel-in-progress: false

jobs:
  windows-static-parity:
    if: github.ref == 'refs/heads/rust-refactor'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify immutable Go oracle object
        run: |
          git cat-file -e '3057a9666ab078270b63c7f06de748069b0d1f4b^{commit}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git cat-file -e '10b561db5706702cd42e047eaeed4ccb5e825351^{commit}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git cat-file -e '0bec60e4406f5d5dc155ee25cef44f9a710e37e8^{commit}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the differential runner (not product parity)
        run: node --test tests/rust-parity/oracle.test.mjs tests/rust-parity/oracle-3.2.2.test.mjs tests/rust-parity/skill-entrypoint-identity.test.mjs crates/lycheedev-cli/tests/contract_metadata.test.mjs tests/rust-parity/describe-contract.test.mjs tools/rust-early-evidence.test.mjs
      - name: Test full Skill packaging and Windows launcher fixtures
        run: |
          node --test tools/skill-contract.test.mjs tools/skill-launcher.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/skill-commands.mjs --target --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/skill-contract.mjs --contract-file tests/rust-parity/go-3.2.2.manifest.json
          exit $LASTEXITCODE
      - name: Test fixed full-corpus acceptance runner
        run: node --test tests/rust-source-full-corpus/runner.test.mjs
      - name: Test independent real Skill acceptance assertions
        run: node --test tests/rust-skill-usage/runner.test.mjs
      - name: Test full native and real IPC acceptance assertions
        run: node --test tests/rust-source-native-acceptance/runner.test.mjs tests/rust-source-native-acceptance/session-ipc.test.mjs tests/rust-source-native-acceptance/diagnostics.test.mjs
      - name: Check exact Go addon resources and delivery templates
        run: node --test tests/rust-parity/addon-delivery-3.2.2.test.mjs tests/rust-parity/release-321-increment.test.mjs tests/rust-parity/release-322-keyboard.test.mjs tests/rust-parity/release-322-increment.test.mjs tests/rust-parity/release-321-guidance.test.mjs
      - name: Test unsafe inventory and enforce owned business guards
        if: ${{ !cancelled() }}
        run: |
          node --test tools/rust-unsafe-boundaries.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/rust-unsafe-boundaries.mjs --check
          exit $LASTEXITCODE
      - name: Authenticate historical 3.2.0 fixture independently
        if: ${{ !cancelled() }}
        run: node tests/rust-parity/run.mjs --verify-fixture
      - name: Authenticate historical 3.2.1 source-derived fixture
        if: ${{ !cancelled() }}
        run: node tests/rust-parity/run-3.2.1.mjs --verify-fixture
      - name: Authenticate current 3.2.2 source-derived fixture
        if: ${{ !cancelled() }}
        run: node tests/rust-parity/run-3.2.2.mjs --verify-fixture
      - name: Report actual parity gaps without allowlisting them
        if: ${{ !cancelled() }}
        run: |
          node tests/rust-parity/run-3.2.2.mjs --json | Out-File -Encoding utf8 rust-parity-report.json
          exit $LASTEXITCODE
      - name: Preserve parity report even when the candidate differs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-static-parity-${{ github.sha }}
          path: rust-parity-report.json
          if-no-files-found: warn
          retention-days: 14

  windows-emmy-public-contracts:
    if: github.ref == 'refs/heads/rust-refactor' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rust-native]'))
    runs-on: windows-2025
    timeout-minutes: 240
    # No needs: product failures must not suppress the independent A/B/C test.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check the exact reviewed contract payload before importing it
        id: payload
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import {readFileSync,readdirSync,lstatSync} from "node:fs";
          import {join} from "node:path";
          import {createHash} from "node:crypto";
          const root="tests/emmy-public-ingestion-three-way", hash=p=>createHash("sha256").update(readFileSync(p)).digest("hex");
          assert.equal(hash(join(root,"freeze.json")),"cceccb0d574bd79d298b47a0563b109fd34b2f4bf532928ed104910be4f5f50d");
          const freeze=JSON.parse(readFileSync(join(root,"freeze.json"))), actual={}; let entries=0;
          function visit(p,rel=""){for(const n of readdirSync(p).sort()){assert(++entries<=8192);const q=join(p,n),r=rel?rel+"/"+n:n,s=lstatSync(q);assert(!s.isSymbolicLink());if(s.isDirectory())visit(q,r);else{assert(s.isFile()&&s.size<=32*1024*1024);if(r!=="freeze.json")actual[r]=hash(q);}}}
          visit(root); assert.deepEqual(Object.entries(actual).sort(),Object.entries(freeze.files).sort());
          console.log(JSON.stringify({state:"reviewed-payload-matches",files:Object.keys(actual).length}));'
          exit $LASTEXITCODE
      - name: Install the fixed official Rust toolchain
        id: rust
        if: steps.payload.outcome == 'success'
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          exit $LASTEXITCODE
      - name: Test exact parser assertions and frozen Windows owner
        id: fixtures
        if: steps.rust.outcome == 'success'
        run: |
          node --test tests/emmy-public-ingestion-three-way/assertions.test.mjs tests/emmy-public-ingestion-three-way/tool_identity.test.mjs tests/emmy-public-ingestion-three-way/tools/rust-owned-process.test.mjs *> .tmp/emmy-public-contract-node-fixtures.log
          $status = $LASTEXITCODE
          Get-Content .tmp/emmy-public-contract-node-fixtures.log
          if ($status -ne 0) { exit $status }
          python -I -B -S tests/emmy-public-ingestion-three-way/check_selected_cache_test.py *> .tmp/emmy-public-contract-cache-fixtures.log
          $status = $LASTEXITCODE
          Get-Content .tmp/emmy-public-contract-cache-fixtures.log
          exit $status
      - name: Run all three native Windows contract variants under one lease
        if: steps.fixtures.outcome == 'success'
        run: |
          node tests/emmy-public-ingestion-three-way/run_windows_three_way.mjs contracts cceccb0d574bd79d298b47a0563b109fd34b2f4bf532928ed104910be4f5f50d *> .tmp/emmy-public-contract-run.log
          $status = $LASTEXITCODE
          Get-Content .tmp/emmy-public-contract-run.log
          exit $status
      - name: Preserve complete and failed evidence without changing the job outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emmy-public-contracts-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .tmp/emmy-public-contract-*.log
            .tmp/rust-disk/evidence/
            .tmp/rust-disk/channels/
            .tmp/rust-process-test-*/
            .tmp/rust-scratch/
            !.tmp/rust-scratch/**/cargo-home/**
            !.tmp/rust-scratch/**/tmp/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  windows-product-foundation:
    # Deliberately no needs: static parity gaps must not suppress real builds.
    if: github.ref == 'refs/heads/rust-refactor' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rust-native]'))
    runs-on: windows-2025
    # Existing native groups (44.5m) plus bounded formal Lua build/run (10m + 20m).
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install fixed official Rust toolchain
        id: rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -Vv
          cargo -V
      - name: Reconstruct and authenticate fixed public Emmy dependency
        id: emmy
        run: |
          python third_party/emmy/prepare.py --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python third_party/emmy/prepare.py --check
          exit $LASTEXITCODE
      - name: Test custody and controlled runner fixtures
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: node --test tools/rust-emmy-identity.test.mjs tools/rust-build.test.mjs
      - name: Test exact owned-process lifecycle and unknown-child rejection
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: node --test tools/rust-owned-process.test.mjs
      - name: Test bounded dependency preparation fixtures
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: python -m unittest discover -s third_party/emmy -p test_prepare.py
      - name: Fetch lockfile dependencies under ownership controls
        id: dependencies
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-fetch -- fetch --locked
      - name: Compile all workspace targets without executing game fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-check --one-shot -- check --locked --offline --workspace --all-targets -j 1
      - name: Build a sealed real CLI executable
        id: cli_binary
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-build.mjs .tmp/ci-cli-artifact dev --one-shot
      - name: Execute sealed CLI version help and describe
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-cli-smoke.mjs .tmp/ci-cli-artifact/artifact.json
      - name: Compare actual early CLI describe against fixed Go contract
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-cli-smoke.mjs .tmp/ci-cli-artifact/artifact.json --contract
      - name: Execute fixed full Retail Source import and public CLI cases
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-source-full-corpus.mjs .tmp/ci-cli-artifact/artifact.json
      - name: Snapshot only completed hash-sealed early evidence
        id: early_snapshot
        if: ${{ !cancelled() }}
        run: node tools/rust-early-evidence.mjs
      - name: Publish early build describe and sealed Retail observations
        if: ${{ !cancelled() && steps.early_snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-early-cli-${{ github.sha }}-${{ github.run_attempt }}
          path: .tmp/ci-early-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Test fixed Go Lua acceptance authentication and stop boundaries
        if: ${{ !cancelled() }}
        run: node --test tools/rust-formal-lua.test.mjs
      - name: Build official Lua 5.1 interpreter for formal addon assertions
        id: formal_lua
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-formal-lua.mjs build .tmp/ci-formal-lua-runtime
      - name: Execute fixed Go Lua addon profiles and pure protocol fixtures
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' && steps.formal_lua.outcome == 'success' }}
        run: node tools/rust-formal-lua.mjs run .tmp/ci-formal-lua-runtime/build-report.json .tmp/ci-cli-artifact/artifact.json
      - name: Check formal Lua bridge selection and completion assertions
        if: ${{ !cancelled() }}
        run: node --test tools/rust-formal-lua-bridge.test.mjs
      - name: Execute real Driver against authenticated formal Lua peer
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' && steps.formal_lua.outcome == 'success' }}
        run: node tools/rust-formal-lua-bridge.mjs
      - name: Run client metadata filesystem fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-client-fixtures --one-shot -- test --locked --offline -p lycheedev-core --lib client:: -j 1
      - name: Run bounded installation selection fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-installation-selection --one-shot -- test --locked --offline -p lycheedev-core --lib installation_selection::tests -j 1
      - name: Run Delivery selection fixtures without installing addons
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-delivery-selection --one-shot -- test --locked --offline -p lycheedev-delivery --lib selection_tests -j 1
      - name: Run combined addon transaction filesystem fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-addon-transaction --one-shot -- test --locked --offline -p lycheedev-delivery --test combined_addon -j 1 -- --nocapture
      - name: Run formal slot maintenance filesystem fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-slot-maintenance --one-shot -- test --locked --offline -p lycheedev-delivery --test slot_maintenance -j 1
      - name: Run Delivery transaction rollback fixtures independently
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-delivery-transactions --one-shot -- test --locked --offline -p lycheedev-delivery --test transactions -j 1
      - name: Run exact Go removal intent and cancellation fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-removal --one-shot -- test --locked --offline -p lycheedev-delivery --lib removal::tests -j 1
      - name: Run Windows checked file ownership and close fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-checked-close --one-shot -- test --locked --offline -p lycheedev-windows --lib filesystem::close_file_tests -j 1
      - name: Run checked Core file cleanup and primary error fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-core-file-cleanup --one-shot -- test --locked --offline -p lycheedev-core --lib storage::checked_close_tests -j 1
      - name: Run controlled repair lock and temporary ownership fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-repair-locks --one-shot -- test --locked --offline -p lycheedev-core --lib storage::controlled_lock_tests -j 1
      - name: Test same-handle blob publication lock waiting
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: node tools/rust-cargo.mjs --owner ci-blob-lock-wait --one-shot -- test --locked --offline -p lycheedev-core --lib storage::blob_wait::tests -j 1
      - name: Run slot-only preflight cleanup and uncertainty fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-slot-preflight --one-shot -- test --locked --offline -p lycheedev-core --lib storage::slot_preflight::tests -j 1
      - name: Run actual DELETE-sharing probe ownership fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-slot-sharing-probe --one-shot -- test --locked --offline -p lycheedev-windows --lib filesystem::sharing_probe::tests -j 1
      - name: Run original-handle cleanup substitution fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-owned-cleanup --one-shot -- test --locked --offline -p lycheedev-windows --lib filesystem::owned_cleanup::tests -j 1
      - name: Run managed repair snapshot and publication fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-formal-repair --one-shot -- test --locked --offline -p lycheedev-delivery --lib formal_repair:: -j 1
      - name: Run checked release validation file cleanup fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-release-file-cleanup --one-shot -- test --locked --offline -p lycheedev-delivery --lib release::checked_close_tests -j 1
      - name: Run Windows no-replace durable move fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-durable-move --one-shot -- test --locked --offline -p lycheedev-windows --lib filesystem::durable_move_tests -j 1
      - name: Run Windows long path and namespace publication fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-native-move-paths --one-shot -- test --locked --offline -p lycheedev-windows --lib filesystem::native_move_path_tests -j 1
      - name: Run cancellation immediately before atomic publication
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-atomic-cancellation --one-shot -- test --locked --offline -p lycheedev-core --lib storage::controlled_publication_tests -j 1
      - name: Run formal typed slot publication and reservation fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-slot-publication --one-shot -- test --locked --offline -p lycheedev-delivery --lib slot_publication::tests -j 1
      - name: Run consuming shared lock close fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-lock-close --one-shot -- test --locked --offline -p lycheedev-core --lib storage::exclusive_lock_close_tests -j 1
      - name: Run tracked console registration lifecycle fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-console-cancel --one-shot -- test --locked --offline -p lycheedev-windows --lib cancellation::tests -j 1
      - name: Run process wait cancellation boundary fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-process-wait --one-shot -- test --locked --offline -p lycheedev-windows --lib process::wait_exit_tests -j 1
      - name: Run fake-window passive discovery fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-passive-fixtures --one-shot -- test --locked --offline -p lycheedev-live --lib passive::tests -j 1
      - name: Run public installation error envelope fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-installation-envelopes --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::installation_ -j 1
      - name: Run CLI contract metadata and arity unit fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-cli-contract --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev contract::tests -j 1
      - name: Run default remote target CLI resolution fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-remote-target-cli --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev target_remote::tests -j 1
      - name: Run normal invocation ordered cancellation fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-cli-control --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::normal_invocation_control_ -j 1
      - name: Run formal Live CLI admission rendering and repair validator fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-formal-live-cli --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev formal_live -j 1
      - name: Run historical read and explicit OP BTP retirement fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-history-read --one-shot -- test --locked --offline -p lycheedev-live --lib history:: -j 1
      - name: Run fixed Go workspace admission compatibility fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-workspace-admission --one-shot -- test --locked --offline -p lycheedev-core --lib workspace::tests -j 1
      - name: Run controlled Data kernel admission and configuration fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-data-admission --one-shot -- test --locked --offline -p lycheedev-core --lib workspace::data_resources:: -j 1
      - name: Run queued Windows Data lock lifetime fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-data-lease --one-shot -- test --locked --offline -p lycheedev-windows --lib data_lease:: -j 1
      - name: Run controlled historical raw metadata read fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-history-metadata --one-shot -- test --locked --offline -p lycheedev-core --lib metadata::historical_read_tests -j 1
      - name: Run historical multi-document transactional CAS fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-history-cas --one-shot -- test --locked --offline -p lycheedev-core --lib metadata::historical_write::tests -j 1
      - name: Run ordered Lua compiler cancellation and retention fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-ordered-luac --one-shot -- test --locked --offline -p lycheedev-source --lib luac::ordered_tests -j 1
      - name: Run exact native raw byte JSON grammar fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-raw-json --one-shot -- test --locked --offline -p lycheedev-core --lib raw_json::tests -j 1
      - name: Run actual Source child scope and cleanup fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
