name: Rust parity foundation (Windows)

# This branch has not converged with main; push coverage must not depend on a
# mergeable pull-request merge ref. No publishing, secrets or game interaction.
# Every push preserves work and runs fast checks. Add [rust-native] to a reviewed
# batch commit to run complete Windows/Emmy acceptance; dispatch is optional.
# Commit selection works on this branch without requiring workflow on main.
on:
  push:
    branches: [rust-refactor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-parity-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rust-native]')) && 'native' || 'fast' }}
  # Preserve the current owned build and terminal evidence; newer batches queue.
  cancel-in-progress: false

jobs:
  windows-static-parity:
    if: github.ref == 'refs/heads/rust-refactor'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify immutable Go oracle object
        run: |
          git cat-file -e '3057a9666ab078270b63c7f06de748069b0d1f4b^{commit}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the differential runner (not product parity)
        run: node --test tests/rust-parity/oracle.test.mjs crates/lycheedev-cli/tests/contract_metadata.test.mjs tests/rust-parity/describe-contract.test.mjs tools/rust-early-evidence.test.mjs
      - name: Test full Skill packaging and Windows launcher fixtures
        run: |
          node --test tools/skill-contract.test.mjs tools/skill-launcher.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/skill-commands.mjs --target --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/skill-contract.mjs --contract-file tests/rust-parity/go-3.2.0.manifest.json
          exit $LASTEXITCODE
      - name: Test fixed full-corpus acceptance runner
        run: node --test tests/rust-source-full-corpus/runner.test.mjs
      - name: Test independent real Skill acceptance assertions
        run: node --test tests/rust-skill-usage/runner.test.mjs
      - name: Test full native and real IPC acceptance assertions
        run: node --test tests/rust-source-native-acceptance/runner.test.mjs tests/rust-source-native-acceptance/session-ipc.test.mjs
      - name: Check exact Go addon resources and delivery templates
        run: node --test tests/rust-parity/addon-delivery-contract.test.mjs
      - name: Test unsafe inventory and enforce owned business guards
        run: |
          node --test tools/rust-unsafe-boundaries.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/rust-unsafe-boundaries.mjs --check
          exit $LASTEXITCODE
      - name: Authenticate source-derived fixture
        run: node tests/rust-parity/run.mjs --verify-fixture
      - name: Report actual parity gaps without allowlisting them
        run: |
          node tests/rust-parity/run.mjs --json | Out-File -Encoding utf8 rust-parity-report.json
          exit $LASTEXITCODE
      - name: Preserve parity report even when the candidate differs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-static-parity-${{ github.sha }}
          path: rust-parity-report.json
          if-no-files-found: warn
          retention-days: 14

  windows-product-foundation:
    # Deliberately no needs: static parity gaps must not suppress real builds.
    if: github.ref == 'refs/heads/rust-refactor' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rust-native]'))
    runs-on: windows-2025
    # Existing native groups (44.5m) plus bounded formal Lua build/run (10m + 20m).
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install fixed official Rust toolchain
        id: rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -Vv
          cargo -V
      - name: Reconstruct and authenticate fixed public Emmy dependency
        id: emmy
        run: |
          python third_party/emmy/prepare.py --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python third_party/emmy/prepare.py --check
          exit $LASTEXITCODE
      - name: Test custody and controlled runner fixtures
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: node --test tools/rust-emmy-identity.test.mjs tools/rust-build.test.mjs
      - name: Test exact owned-process lifecycle and unknown-child rejection
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: node --test tools/rust-owned-process.test.mjs
      - name: Test bounded dependency preparation fixtures
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: python -m unittest discover -s third_party/emmy -p test_prepare.py
      - name: Fetch lockfile dependencies under ownership controls
        id: dependencies
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.emmy.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-fetch -- fetch --locked
      - name: Compile all workspace targets without executing game fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-check --one-shot -- check --locked --offline --workspace --all-targets -j 1
      - name: Build a sealed real CLI executable
        id: cli_binary
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-build.mjs .tmp/ci-cli-artifact dev --one-shot
      - name: Execute sealed CLI version help and describe
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-cli-smoke.mjs .tmp/ci-cli-artifact/artifact.json
      - name: Compare actual early CLI describe against fixed Go contract
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-cli-smoke.mjs .tmp/ci-cli-artifact/artifact.json --contract
      - name: Snapshot only completed hash-sealed early evidence
        id: early_snapshot
        if: ${{ !cancelled() }}
        run: node tools/rust-early-evidence.mjs
      - name: Publish early build and describe diagnostics before long tests
        if: ${{ !cancelled() && steps.early_snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-early-cli-${{ github.sha }}-${{ github.run_attempt }}
          path: .tmp/ci-early-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Test fixed Go Lua acceptance authentication and stop boundaries
        if: ${{ !cancelled() }}
        run: node --test tools/rust-formal-lua.test.mjs
      - name: Build official Lua 5.1 interpreter for formal addon assertions
        id: formal_lua
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-formal-lua.mjs build .tmp/ci-formal-lua-runtime
      - name: Execute fixed Go Lua addon profiles and pure protocol fixtures
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' && steps.formal_lua.outcome == 'success' }}
        run: node tools/rust-formal-lua.mjs run .tmp/ci-formal-lua-runtime/build-report.json .tmp/ci-cli-artifact/artifact.json
      - name: Run client metadata filesystem fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-client-fixtures --one-shot -- test --locked --offline -p lycheedev-core --lib client::tests -j 1
      - name: Run bounded installation selection fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-installation-selection --one-shot -- test --locked --offline -p lycheedev-core --lib installation_selection::tests -j 1
      - name: Run Delivery selection fixtures without installing addons
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-delivery-selection --one-shot -- test --locked --offline -p lycheedev-delivery --lib selection_tests -j 1
      - name: Run combined addon transaction filesystem fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-addon-transaction --one-shot -- test --locked --offline -p lycheedev-delivery --test combined_addon -j 1
      - name: Run formal slot maintenance filesystem fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-slot-maintenance --one-shot -- test --locked --offline -p lycheedev-delivery --test slot_maintenance -j 1
      - name: Run Delivery transaction rollback fixtures independently
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-delivery-transactions --one-shot -- test --locked --offline -p lycheedev-delivery --test transactions -j 1
      - name: Run exact Go removal intent and cancellation fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-removal --one-shot -- test --locked --offline -p lycheedev-delivery --lib removal::tests -j 1
      - name: Run Windows checked file ownership and close fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-checked-close --one-shot -- test --locked --offline -p lycheedev-windows --lib filesystem::close_file_tests -j 1
      - name: Run checked Core file cleanup and primary error fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-core-file-cleanup --one-shot -- test --locked --offline -p lycheedev-core --lib storage::checked_close_tests -j 1
      - name: Run controlled repair lock and temporary ownership fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-repair-locks --one-shot -- test --locked --offline -p lycheedev-core --lib storage::controlled_lock_tests -j 1
      - name: Run original-handle cleanup substitution fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-owned-cleanup --one-shot -- test --locked --offline -p lycheedev-windows --lib filesystem::owned_cleanup::tests -j 1
      - name: Run managed repair snapshot and publication fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-formal-repair --one-shot -- test --locked --offline -p lycheedev-delivery --lib formal_repair:: -j 1
      - name: Run checked release validation file cleanup fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-release-file-cleanup --one-shot -- test --locked --offline -p lycheedev-delivery --lib release::checked_close_tests -j 1
      - name: Run Windows no-replace durable move fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-durable-move --one-shot -- test --locked --offline -p lycheedev-windows --lib filesystem::durable_move_tests -j 1
      - name: Run cancellation immediately before atomic publication
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-atomic-cancellation --one-shot -- test --locked --offline -p lycheedev-core --lib storage::controlled_publication_tests -j 1
      - name: Run formal typed slot publication and reservation fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-slot-publication --one-shot -- test --locked --offline -p lycheedev-delivery --lib slot_publication::tests -j 1
      - name: Run consuming shared lock close fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-lock-close --one-shot -- test --locked --offline -p lycheedev-core --lib storage::exclusive_lock_close_tests -j 1
      - name: Run tracked console registration lifecycle fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-console-cancel --one-shot -- test --locked --offline -p lycheedev-windows --lib cancellation::tests -j 1
      - name: Run process wait cancellation boundary fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-process-wait --one-shot -- test --locked --offline -p lycheedev-windows --lib process::wait_exit_tests -j 1
      - name: Run fake-window passive discovery fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-passive-fixtures --one-shot -- test --locked --offline -p lycheedev-live --lib passive::tests -j 1
      - name: Run public installation error envelope fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-installation-envelopes --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::installation_ -j 1
      - name: Run CLI contract metadata and arity unit fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-cli-contract --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev contract::tests -j 1
      - name: Run normal invocation ordered cancellation fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-cli-control --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::normal_invocation_control_ -j 1
      - name: Run formal Live CLI admission rendering and repair validator fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-formal-live-cli --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev formal_live -j 1
      - name: Run ordered Lua compiler cancellation and retention fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-ordered-luac --one-shot -- test --locked --offline -p lycheedev-source --lib luac::ordered_tests -j 1
      - name: Run exact native raw byte JSON grammar fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-raw-json --one-shot -- test --locked --offline -p lycheedev-core --lib raw_json::tests -j 1
      - name: Run actual Source child scope and cleanup fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-source-process --one-shot -- test --locked --offline -p lycheedev-source --lib process::tests -j 1
      - name: Run bounded Emmy doctor evidence fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-emmy-doctor --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::emmy_doctor_ -j 1
      - name: Run preserved release integrity doctor fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-doctor-release --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::doctor_release_ -j 1
      - name: Run native session lifecycle unit fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-session-lifecycle --one-shot -- test --locked --offline -p lycheedev-source --lib native_session:: -j 1
      - name: Run native research plans projections and XML preparation fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        # Actual modules are plan::tests, projection_tests, load_context_tests
        # and reply_assembly_tests; native_research::tests matched zero tests.
        run: |
          node tools/rust-cargo.mjs --owner ci-source-research --one-shot -- test --locked --offline -p lycheedev-source --lib native_research:: -j 1
      - name: Run owned Emmy adapter declaration contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-emmy-adapter --one-shot -- test --locked --offline -p lycheedev-emmy-adapter --test declaration_contract -j 1
      - name: Run source batch admission ownership and budget fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-source-batch --one-shot -- test --locked --offline -p lycheedev-source --lib batch::tests -j 1
      - name: Run public refs and context shared evaluator regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-refs-context --one-shot -- test --locked --offline -p lycheedev-source --test refs_context -j 1
      - name: Run Source advertised registry regression
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-source-registry --one-shot -- test --locked --offline -p lycheedev-source --lib public_command_registry -j 1
      - name: Run Source query admission unit fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-query-default --one-shot -- test --locked --offline -p lycheedev-source --lib public_query_defaults -j 1
      - name: Run ordered cancellation and deadline cause fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-core-control --one-shot -- test --locked --offline -p lycheedev-core --lib control::tests -j 1
      - name: Run shared Core mailbox envelope and payload fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-core-mailbox --one-shot -- test --locked --offline -p lycheedev-core --test mailbox_contract -j 1
      - name: Run exact Go code byte and JSON persistence boundaries
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-code-bytes --one-shot -- test --locked --offline -p lycheedev-core --lib mailbox::code_bytes_tests -j 1
      - name: Run formal Go mailbox v1 pure fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-mailbox-v1 --one-shot -- test --locked --offline -p lycheedev-live --lib go_mailbox_v1 -j 1
      - name: Run formal mailbox input engine and identity fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node tools/rust-cargo.mjs --owner ci-mailbox-input-unit --one-shot -- test --locked --offline -p lycheedev-windows --lib mailbox_input:: -j 1
      - name: Run owned Windows mailbox input window fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-mailbox-input-window --one-shot -- test --locked --offline -p lycheedev-windows --test mailbox_input_fixture -j 1
      - name: Run production mailbox lookup and binding fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-mailbox-lookup --one-shot -- test --locked --offline -p lycheedev-live --test mailbox_lookup -j 1
      - name: Run formal RIP recipes and sparse root fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node tools/rust-cargo.mjs --owner ci-formal-runtime-root --one-shot -- test --locked --offline -p lycheedev-live --lib runtime_root:: -j 1
      - name: Run trusted runtime module and EXE qualification fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node tools/rust-cargo.mjs --owner ci-trusted-runtime --one-shot -- test --locked --offline -p lycheedev-windows --lib process::runtime_ -j 1
      - name: Run exact process lifetime classification fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node tools/rust-cargo.mjs --owner ci-process-lifetime-unit --one-shot -- test --locked --offline -p lycheedev-windows --lib process::lifetime:: -j 1
      - name: Run owned child process lifetime observations
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-process-lifetime-child --one-shot -- test --locked --offline -p lycheedev-windows --test process_lifetime -j 1
      - name: Run owned Windows runtime memory fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-runtime-memory --one-shot -- test --locked --offline -p lycheedev-windows --test runtime_module -j 1
      - name: Run bound runtime observation fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-runtime-observation --one-shot -- test --locked --offline -p lycheedev-live --lib runtime_binding::tests -j 1
      - name: Run real local Data installation and catalog fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-data-installation --one-shot -- test --locked --offline -p lycheedev-data --test installed_parity -j 1
      - name: Run local Data domain fixtures independently
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-data-domain --one-shot -- test --locked --offline -p lycheedev-data --test local_domain_parity -j 1
      - name: Run named Hotfix table and ChangesPin fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-hotfix-table --one-shot -- test --locked --offline -p lycheedev-data --test hotfix_table_parity -j 1
      - name: Run durable Hotfix scan checkpoint and resume fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-hotfix-scan --one-shot -- test --locked --offline -p lycheedev-data --test hotfix_scan_parity -j 1
      - name: Run Data advertised command surface fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-data-registry --one-shot -- test --locked --offline -p lycheedev-data --lib command_surface_tests -j 1
      - name: Run typed Hotfix budget and field encoding fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-hotfix-decode --one-shot -- test --locked --offline -p lycheedev-data --lib hotfix:: -j 1
      - name: Run effective SQL request admission and resource boundaries
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-effective-sql-unit --one-shot -- test --locked --offline -p lycheedev-data --lib local_query:: -j 1
      - name: Run scoped SQL retained resource lifetime fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-sql-resource-lifetime --one-shot -- test --locked --offline -p lycheedev-data --lib resource::temporary_tests -j 1
      - name: Run effective SQL overlays and exact parameter integration fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-effective-sql-parity --one-shot -- test --locked --offline -p lycheedev-data --test effective_sql_parity -j 1
      - name: Run query capture reference publication and ABA fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-query-reference-publication --one-shot -- test --locked --offline -p lycheedev-core --test capture_query_references -j 1
      - name: Run immutable capture dependency transaction fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-capture-dependencies --one-shot -- test --locked --offline -p lycheedev-core --test capture_dependencies -j 1
      - name: Run explicit public JSON numeric provenance fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node tools/rust-cargo.mjs --owner ci-public-json --one-shot -- test --locked --offline -p lycheedev-core --lib public_json:: -j 1
      - name: Run actual CLI public JSON envelope fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node tools/rust-cargo.mjs --owner ci-cli-public-json --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::public_json -j 1
      - name: Run public error and stream raw-number preservation
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          node tools/rust-cargo.mjs --owner ci-cli-public-raw --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::public_error_and_typed_stream -j 1
      - name: Run capture identity and Go consumer compatibility fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node tools/rust-cargo.mjs --owner ci-capture-identity --one-shot -- test --locked --offline -p lycheedev-core --lib evidence:: -j 1
      - name: Run SQLite lock cancellation and rollback fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-metadata-cancel --one-shot -- test --locked --offline -p lycheedev-core --lib metadata::controlled_tests -j 1
      - name: Run target cancellation before symbolic resolution
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node tools/rust-cargo.mjs --owner ci-target-cancellation --one-shot -- test --locked --offline -p lycheedev-cli --bin lycheedev tests::target_dispatch_preserves_invocation_cancellation_and_deadline -j 1
      - name: Execute real Emmy doctor in an isolated workspace
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-cli-smoke.mjs .tmp/ci-cli-artifact/artifact.json --doctor
      - name: Execute fixed full Retail Source import and public CLI cases
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-source-full-corpus.mjs .tmp/ci-cli-artifact/artifact.json
      - name: Rebuild the independently verified Lua compiler identity
        id: candidate_luac
        if: ${{ !cancelled() && steps.cli_binary.outcome == 'success' }}
        run: node tools/luac.mjs build .tmp/ci-package-luac
      - name: Execute authenticated ordered Lua compiler regression
        if: ${{ !cancelled() && steps.candidate_luac.outcome == 'success' }}
        run: |
          $env:LYCHEEDEV_LUAC_STAGE = (Resolve-Path .tmp/ci-package-luac).Path
          node tools/rust-cargo.mjs --owner ci-ordered-luac-real --one-shot -- test --locked --offline -p lycheedev-source --test luac_ordered_real -j 1 -- --ignored --nocapture
          exit $LASTEXITCODE
      - name: Assemble an unpublished exact-source candidate with licenses
        id: candidate_package
        if: ${{ !cancelled() && steps.candidate_luac.outcome == 'success' && steps.cli_binary.outcome == 'success' }}
        run: node tools/rust-package-smoke.mjs .tmp/ci-source-candidate .tmp/ci-package-luac --artifact .tmp/ci-cli-artifact/artifact.json --assembly-only
      - name: Exercise real multi-CLI native session and failure cleanup
        if: ${{ !cancelled() && steps.candidate_package.outcome == 'success' }}
        run: |
          $env:LYCHEEDEV_SOURCE_NATIVE_RELEASE = (Resolve-Path .tmp/ci-source-candidate/package).Path
          $env:LYCHEEDEV_SOURCE_NATIVE_KEEP_FIXTURE = '1'
          New-Item -ItemType Directory -Force -Path .tmp/ci-source-native-temp | Out-Null
          $env:TEMP = (Resolve-Path .tmp/ci-source-native-temp).Path
          $env:TMP = $env:TEMP
          node tools/rust-cargo.mjs --owner ci-native-session --one-shot -- test --locked --offline -p lycheedev-cli --test source_native_session_public -j 1 -- --ignored --nocapture
          exit $LASTEXITCODE
      - name: Exercise packaged Skill through actual fixed-source CLI tasks
        if: ${{ !cancelled() && steps.candidate_package.outcome == 'success' }}
        run: node tools/rust-skill-usage.mjs .tmp/ci-cli-artifact/artifact.json .tmp/ci-source-candidate/report.json
      - name: Exercise complete fixed Retail native semantic and retained session
        if: ${{ !cancelled() && steps.candidate_package.outcome == 'success' }}
        run: node tools/rust-source-native-acceptance.mjs .tmp/ci-cli-artifact/artifact.json .tmp/ci-source-candidate/report.json full
      - name: Exercise real native IPC attempted-operation quota
        if: ${{ !cancelled() && steps.candidate_package.outcome == 'success' }}
        run: node tools/rust-source-native-acceptance.mjs .tmp/ci-cli-artifact/artifact.json .tmp/ci-source-candidate/report.json quota
      - name: Exercise real native IPC idle retirement
        if: ${{ !cancelled() && steps.candidate_package.outcome == 'success' }}
        run: node tools/rust-source-native-acceptance.mjs .tmp/ci-cli-artifact/artifact.json .tmp/ci-source-candidate/report.json idle
      - name: Exercise real native IPC lifetime retirement
        if: ${{ !cancelled() && steps.candidate_package.outcome == 'success' }}
        run: node tools/rust-source-native-acceptance.mjs .tmp/ci-cli-artifact/artifact.json .tmp/ci-source-candidate/report.json lifetime
      - name: Preserve each controlled command receipt and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-product-foundation-${{ github.sha }}
          path: |
            .tmp/rust-disk/evidence/
            .tmp/rust-process-test-*/
            .tmp/ci-cli-artifact/
            .tmp/ci-package-luac/
            .tmp/ci-source-candidate/
            .tmp/ci-source-native-temp/
            .tmp/ci-formal-lua-runtime/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  windows-emmy-context:
    env:
      # Nested upstream rust-toolchain.toml must not select moving stable.
      RUSTUP_TOOLCHAIN: '1.99.0'
    # Separate host/ownership channel: never reuse an unresolved local build lease.
    if: github.ref == 'refs/heads/rust-refactor' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rust-native]'))
    runs-on: windows-2025
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install fixed official Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
          exit $LASTEXITCODE
      - name: Reconstruct exact reviewed public source candidate
        run: |
          python third_party/emmy/prepare.py --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node third_party/emmy/check.mjs --verify
          exit $LASTEXITCODE
      - name: Fetch locked integration-test dependencies under ownership controls
        run: node third_party/emmy/check.mjs fetch --locked
      - name: Execute public context and cardinality integration tests
        run: node third_party/emmy/check.mjs test --offline --locked -p emmylua_code_analysis --test lychee_context --test lychee_cardinality --test lychee_checker_guards -j 1
      - name: Preserve exact recipe and owned execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-emmy-context-${{ github.sha }}
          path: .tmp/rust-disk/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
