name: toolkit foundation

# Toolkit CI; current development and release contract: docs/development.md.
#
# Five REQUIRED job names, referenced literally by branch protection (do not
# rename, and do not turn a required job into a matrix — matrix legs would
# suffixed the check names and break the literal references):
#
#   windows-contract          vet, naming/import + skill/schema
#                             consistency, full Go suite with Lua 5.1 REQUIRED
#   windows-process           real multi-CLI-process, OS-lock and same-window
#                             exclusivity contracts, run natively on Windows
#   windows-addon             supported-client Lua matrix plus retained
#                             Forever fixture, locale, TOC
#                             order, event catalogs, addon ZIP structure
#   windows-package           Windows-native release exe, real npm tgz,
#                             isolated --ignore-scripts install (space +
#                             Chinese paths), offline business smoke
#   windows-amd64 is the only shipped platform; its run smoke lives in
#   toolkit-release.yml's platform-smoke stage.
#   ci-required               aggregation; skipped/cancelled never counts as
#                             passed
#
# `race` also gates ci-required.
#
# This workflow is also a reusable workflow: toolkit-release.yml calls it as
# the release verification gate.

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# §2: superseded PR runs may be cancelled; push runs stay sequential.
concurrency:
  group: toolkit-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: windows-2025
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.1'
      - name: Classify exact changed paths and check development-document links
        id: scope
        shell: pwsh
        run: |
          node tools/ci-scope.mjs
          if ($LASTEXITCODE -ne 0) { throw 'change classification or document links failed' }

  windows-contract:
    needs: changes
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Normalize TMP to the long runner temp path
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        # Hosted windows runners expose an 8.3 short TEMP
        # (C:\Users\RUNNER~1\...) and every t.TempDir() fixture inherits it.
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          node-version: '24.18.1'
      - name: Prepare pinned Windows native compiler
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: node tools/native-toolchain.mjs prepare
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          dotnet-version: '10.0.100'
      - name: Pin the Go release toolchain
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = go version
          if ($LASTEXITCODE -ne 0) { throw 'go version failed' }
          if ($version -notmatch '^go version go1\.27\.1 ') { throw "toolchain drift: $version" }
      - run: go mod verify
        if: ${{ needs.changes.outputs.scope != 'docs' }}
      - run: node tools/version.mjs --check
        if: ${{ needs.changes.outputs.scope != 'docs' }}
      - run: node tools/release.mjs verify-source-inputs
        if: ${{ needs.changes.outputs.scope != 'docs' }}
      - name: Node tool tests (version, release, tar, tgz, addon-package)
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          node --test tools/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'tools tests failed' }
      - name: Naming and import constraints
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          node tools/import-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'import contract failed' }
      - run: go vet ./...
        if: ${{ needs.changes.outputs.scope != 'docs' }}
      - run: go test -p=1 -parallel=2 -timeout=0 -tags casc_oracle ./tests/data-regression/compare
        if: ${{ needs.changes.outputs.scope != 'docs' }}
      - name: Build checksum-pinned Lua 5.1.5
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $luaDirectory = Join-Path $env:RUNNER_TEMP 'toolkit-lua51'
          node tests/tools/build-lua.mjs $luaDirectory gcc
          if ($LASTEXITCODE -ne 0) { throw 'Lua interpreter build failed' }
          "LYCHEEDEV_LUA51=$(Join-Path $luaDirectory 'lua.exe')" >> $env:GITHUB_ENV
          'LYCHEEDEV_REQUIRE_LUA51=1' >> $env:GITHUB_ENV
      - name: Preserve Windows Lua build identity
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-contract-lua51-report
          path: ${{ runner.temp }}/toolkit-lua51/build-report.json
          if-no-files-found: error
      - name: Prepare fixed public integration inputs for the same full suite
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        id: integration-inputs
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/ci-inputs.mjs prepare --out (Join-Path $env:RUNNER_TEMP 'toolkit-integration-inputs')
          if ($LASTEXITCODE -ne 0) { throw 'pinned integration input preparation failed' }
      - name: Full Go suite with Lua 5.1 required (missing interpreter fails, never skips)
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        id: go-suite
        env:
          COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Instrument this same full-suite run, rather than duplicating it for
          # coverage. Lua/Node/business scenarios are not Go statement coverage.
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'toolkit-go-coverage'
          New-Item -ItemType Directory -Force $report | Out-Null
          $module = (go list -m).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'go module identity failed' }
          $listed = @(go list -f '{{.ImportPath}}|{{if or .TestGoFiles .XTestGoFiles}}true{{else}}false{{end}}' ./...)
          if ($LASTEXITCODE -ne 0) { throw 'go package selection failed' }
          $packages = @($listed | ForEach-Object {
            $fields = $_ -split '\|'
            $path = $fields[0]
            $helper = $path -eq "$module/internal/testkit"
            [ordered]@{
              importPath = $path
              hasTests = $fields[1] -eq 'true'
              helper = $helper
              instrumented = (-not $helper) -and ($path.StartsWith("$module/internal/") -or $path.StartsWith("$module/cmd/"))
            }
          })
          $scope = ($packages | Where-Object { $_.instrumented } | ForEach-Object { $_.importPath }) -join ','
          $profile = Join-Path $report 'cover.out'
          $events = Join-Path $report 'go-test.jsonl'
          $command = @('test', '-json', '-p=2', '-parallel=4', '-count=1', '-timeout=0', '-covermode=atomic', "-coverpkg=$scope", "-coverprofile=$profile", './...')
          & go @command > $events 2> (Join-Path $report 'stderr.log')
          $testExit = $LASTEXITCODE
          $identity = [ordered]@{
            testedCommit = (git rev-parse HEAD).Trim()
            testedTree = (git rev-parse 'HEAD^{tree}').Trim()
            requestedPrHead = $env:COVERAGE_PR_HEAD
            goVersion = (go version).Trim()
            goos = (go env GOOS).Trim()
            goarch = (go env GOARCH).Trim()
            command = @('go') + $command
            exitCode = $testExit
            packages = $packages
          }
          $identity | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $report 'identity.json')
          if ($testExit -ne 0) {
            Get-Content (Join-Path $report 'stderr.log')
            Get-Content $events -Tail 80
          }
          node tools/go-coverage.mjs --profile $profile --events $events --identity (Join-Path $report 'identity.json') --out (Join-Path $report 'summary.json')
          $coverageExit = $LASTEXITCODE
          node tools/ci-inputs.mjs verify --events $events --out (Join-Path $report 'required-integrations.json')
          if ($LASTEXITCODE -ne 0 -or $coverageExit -ne 0 -or $testExit -ne 0) { throw 'go test, coverage or required integration evidence failed' }
      - name: Preserve exact Go coverage evidence
        if: ${{ needs.changes.outputs.scope != 'docs' && !cancelled() && steps.go-suite.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-go-coverage
          path: ${{ runner.temp }}/toolkit-go-coverage/
          if-no-files-found: error
      - name: Preserve pinned integration input identities
        if: ${{ needs.changes.outputs.scope != 'docs' && !cancelled() && steps.integration-inputs.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-integration-inputs
          path: |
            ${{ runner.temp }}/toolkit-integration-inputs/inputs.json
            ${{ runner.temp }}/toolkit-integration-inputs/documentation-inputs.json
            ${{ runner.temp }}/toolkit-integration-inputs/dbcd-inputs.json
            ${{ runner.temp }}/toolkit-integration-inputs/definitions/manifest.json
            ${{ runner.temp }}/toolkit-integration-inputs/oracle/oracle-build.json
            ${{ runner.temp }}/toolkit-integration-inputs/oracle/CascLib-LICENSE
            ${{ runner.temp }}/toolkit-integration-inputs/release/release.json
          if-no-files-found: error
      - name: Native doctor volume-boundary evidence from the full suite
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          node tools/ci-evidence.mjs --group doctor --directory (Join-Path $env:RUNNER_TEMP 'toolkit-go-coverage')
          if ($LASTEXITCODE -ne 0) { throw 'doctor evidence failed' }
      - name: Describe the prepared native CLI
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          & $env:LYCHEEDEV_SOURCE_PACKAGE_BINARY describe --format json
          if ($LASTEXITCODE -ne 0) { throw 'describe failed' }
      - name: Skill / command-reference consistency (schema vs documented commands)
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          node tools/skill-contract.mjs --bin $env:LYCHEEDEV_SOURCE_PACKAGE_BINARY
          if ($LASTEXITCODE -ne 0) { throw 'skill contract failed' }

  windows-process:
    needs: [changes, windows-contract]
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          node-version: '24.18.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          name: windows-go-coverage
          path: ${{ runner.temp }}/toolkit-go-coverage
      - name: Verify actual multi-process and OS-lock execution from the full suite
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          node tools/ci-evidence.mjs --group process --directory (Join-Path $env:RUNNER_TEMP 'toolkit-go-coverage')
          if ($LASTEXITCODE -ne 0) { throw 'process evidence failed' }

  windows-addon:
    needs: [changes, windows-contract]
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          node-version: '24.18.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          name: windows-go-coverage
          path: ${{ runner.temp }}/toolkit-go-coverage
      - name: Verify Lua matrix, protocol and TOC execution from the full suite
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          node tools/ci-evidence.mjs --group addon --directory (Join-Path $env:RUNNER_TEMP 'toolkit-go-coverage')
          if ($LASTEXITCODE -ne 0) { throw 'addon evidence failed' }
      - name: Addon release ZIP structure check (build + verify, "Lychee Dev/" root)
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'addon-zip'
          node tools/addon-package.mjs build --out $out
          if ($LASTEXITCODE -ne 0) { throw 'addon ZIP structure check failed' }
          "zip_directory=$out" >> $env:GITHUB_OUTPUT
        id: addon-zip
      - name: Preserve the addon release ZIP
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-addon-release-zip
          path: ${{ steps.addon-zip.outputs.zip_directory }}/*.zip
          if-no-files-found: error

  windows-package:
    needs: changes
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Normalize TMP to the long runner temp path
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        # Hosted windows runners expose an 8.3 short TEMP
        # (C:\Users\RUNNER~1\...) and every t.TempDir() fixture inherits it.
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          node-version: '24.18.1'
      - name: Prepare pinned Windows native compiler
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: node tools/native-toolchain.mjs prepare
      - name: Pin npm build tool
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm tool installation failed' }
          $actual = npm --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne '11.18.0') { throw 'npm tool version mismatch' }
      - name: Packaging license gate
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        # Same semantics as licenseGate in tools/release.mjs: the combined-work
        # license decision belongs to the project owner; packaging refuses to
        # proceed until packages/npm/lycheedev/LICENSE exists.
        run: |
          $ErrorActionPreference = 'Stop'
          $license = 'packages/npm/lycheedev/LICENSE'
          if (-not (Test-Path $license) -or (Get-Item $license).Length -eq 0) {
            throw "license decision pending: $license is absent; the combined-work license decision belongs to the project owner (see THIRD_PARTY_NOTICES.md owner-decision section), and packaging refuses to proceed until the owner supplies LICENSE"
          }
      - name: Windows-native release exe build and identity check
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'lycheedev-release.exe'
          $env:CGO_ENABLED = '1'
          go build -trimpath -ldflags=-buildid= -buildvcs=true -o $exe ./cmd/lycheedev
          if ($LASTEXITCODE -ne 0) { throw 'release exe build failed' }
          $version = & $exe version --format=json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $version.ok) { throw 'release exe version command failed' }
          $commit = (git rev-parse HEAD).Trim()
          if ($version.result.commit -ne $commit) { throw "release exe commit $($version.result.commit) != HEAD $commit" }
      - name: Launcher contracts
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: |
          node --test packages/npm/lycheedev/test/launcher.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'launcher tests failed' }
      - name: Actual tgz and isolated addon-skill deployment without scripts
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        # install-smoke packs a real tgz, installs it into an isolated prefix
        # under a path containing spaces and Chinese characters with
        # --ignore-scripts, then runs the offline business smoke (version,
        # init, target resolve, project lock discovery, Hotfix/asset decode
        # through the installed launcher, recovery, skill/addon deploy).
        id: package-smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $npmDirectory = Split-Path (Get-Command npm.cmd).Source
          $npmCli = Join-Path $npmDirectory 'node_modules/npm/bin/npm-cli.js'
          node packages/npm/lycheedev/test/install-smoke.mjs $npmCli --bin (Join-Path $env:RUNNER_TEMP 'lycheedev-release.exe')
          if ($LASTEXITCODE -ne 0) { throw 'isolated package installation failed' }
      - name: Preserve package smoke report
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-report
          path: ${{ steps.package-smoke.outputs.report }}
          if-no-files-found: error

  race:
    name: shared-state race detection
    needs: changes
    runs-on: windows-2025
    steps:
      - name: Normalize TMP to the long runner temp path
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        # Hosted windows runners expose an 8.3 short TEMP
        # (C:\Users\RUNNER~1\...) and every t.TempDir() fixture inherits it.
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        with:
          node-version: '24.18.1'
      - name: Prepare pinned Windows native compiler
        if: ${{ needs.changes.outputs.scope != 'docs' }}
        run: node tools/native-toolchain.mjs prepare
      # Bound concurrency for filesystem-heavy managed installation and Native lifecycle tests.
      - run: go test -race -p=2 -parallel=4 -count=1 -timeout=0 ./...
        if: ${{ needs.changes.outputs.scope != 'docs' }}

  ci-required:
    # §2/§3: this aggregation always runs and rejects every non-success result;
    # skipped or cancelled required jobs never count as passed.
    if: always()
    needs:
      - changes
      - windows-contract
      - windows-process
      - windows-addon
      - windows-package
      - race
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Normalize TMP to the long runner temp path
        # Hosted windows runners expose an 8.3 short TEMP
        # (C:\Users\RUNNER~1\...) and every t.TempDir() fixture inherits it.
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reject failures, skipped jobs and cancellation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WINDOWS_CONTRACT_RESULT: ${{ needs.windows-contract.result }}
          WINDOWS_PROCESS_RESULT: ${{ needs.windows-process.result }}
          WINDOWS_ADDON_RESULT: ${{ needs.windows-addon.result }}
          WINDOWS_PACKAGE_RESULT: ${{ needs.windows-package.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          status=0
          check() {
            local name="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::required job ${name} finished with ${result}"
              status=1
            fi
          }
          check changes "$CHANGES_RESULT"
          check windows-contract "$WINDOWS_CONTRACT_RESULT"
          check windows-process "$WINDOWS_PROCESS_RESULT"
          check windows-addon "$WINDOWS_ADDON_RESULT"
          check windows-package "$WINDOWS_PACKAGE_RESULT"
          check race "$RACE_RESULT"
          exit $status
