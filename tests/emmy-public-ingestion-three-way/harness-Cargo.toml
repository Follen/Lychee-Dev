# Validation-only workspace. Package/dependency/profile values match the frozen
# original root; only the two local adapter crates are workspace members.
[workspace]
members = ["crates/lycheedev-emmy-adapter", "crates/lycheedev-binding-contracts"]
exclude = [".tmp/emmy-reconstruction-v1/upstream", ".tmp/emmy-reconstruction-v1/upstream/crates/*"]
resolver = "2"

[workspace.package]
version = "3.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }

[profile.dev]
debug = 1
incremental = false
[profile.dev.package."*"]
debug = 0
[profile.test]
debug = 1
incremental = false
[profile.test.package."*"]
debug = 0
