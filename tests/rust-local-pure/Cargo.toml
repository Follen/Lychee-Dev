[package]
name = "lycheedev-local-pure"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# An isolated development harness, never a product or distribution crate.
[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
hex = "=0.4.3"

# Matches the repository's genuine optimized symbols profile and channel.
[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[profile.symbols]
inherits = "release"
debug = 2
strip = "none"
incremental = false
