[package]
name = "lycheedev-publish"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lycheedev-core.workspace = true
lycheedev-windows.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
reqwest = { version = "=0.12.24", default-features = false, features = ["native-tls", "stream"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "time", "fs", "io-util", "macros"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["io"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
sha1 = "0.10"
sha2.workspace = true
hex.workspace = true
base64 = "=0.22.1"
regex = "1.12"
html5gum = { version = "=0.8.4", default-features = false }
md-5 = "=0.10.6"
chrono.workspace = true
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
rusqlite = { workspace = true, features = ["serialize"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "native-tls"] }
