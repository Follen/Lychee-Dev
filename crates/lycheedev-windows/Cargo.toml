[package]
name = "lycheedev-windows"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
md-5 = "0.10.6"

[[test]]
name = "guarded_spawn_fixture"
path = "tests/guarded_spawn_fixture.rs"
harness = false

[dependencies.windows]
version = "0.62.2"
features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Performance", "Win32_System_Console", "Win32_Globalization", "Win32_UI_Shell", "Win32_System_Registry"]

