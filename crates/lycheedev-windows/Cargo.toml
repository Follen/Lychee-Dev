[package]
name = "lycheedev-windows"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
md-5 = "0.10.6"

[[test]]
name = "guarded_spawn_fixture"
path = "tests/guarded_spawn_fixture.rs"
