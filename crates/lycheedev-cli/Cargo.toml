[package]
name = "lycheedev-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "lycheedev"
path = "src/main.rs"

[dependencies]
lycheedev-core.workspace = true
lycheedev-source.workspace = true
lycheedev-data.workspace = true
lycheedev-live.workspace = true
lycheedev-delivery.workspace = true
lycheedev-windows.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Reuse the authenticated Data CASC/DBD/WDC fixture in actual CLI regressions.
md-5 = "0.10.6"
sha2.workspace = true
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }

# Shared authenticated test fixture reads the private Data cache metadata.
rusqlite.workspace = true
