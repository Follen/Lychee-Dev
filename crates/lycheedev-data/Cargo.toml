[package]
name = "lycheedev-data"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lycheedev-core = { path = "../lycheedev-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value", "unbounded_depth"] }
chrono.workspace = true
base64 = "=0.22.1"
sha2 = "0.10"
md-5 = "0.10.6"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["block-boundary"] }
regex = "1.12"
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }
num-rational = "=0.4.2"
num-traits = "=0.2.19"
ureq = { version = "=3.1.2", default-features = false, features = ["native-tls"] }
png = "=0.18.1"
image-webp = "=0.2.4"

# Operation-owned cancellable HTTP, with platform TLS and explicit policies.
reqwest = { version = "=0.12.24", default-features = false, features = ["native-tls", "stream", "socks"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "time", "io-util", "macros"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["io"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
idna = "=1.1.0"
