[package]
name = "lycheedev-data"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lycheedev-core = { path = "../lycheedev-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10.6"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
regex = "1.12"
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }
num-rational = "=0.4.2"
num-traits = "=0.2.19"
ureq = { version = "=3.1.2", default-features = false, features = ["native-tls"] }
png = "=0.18.1"
image-webp = "=0.2.4"
