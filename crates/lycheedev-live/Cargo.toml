[package]
name = "lycheedev-live"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
hex.workspace = true
chrono.workspace = true
lycheedev-core.workspace = true
lycheedev-windows.workspace = true
lycheedev-delivery = { path = "../lycheedev-delivery" }

[dev-dependencies]
base64 = "=0.22.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
