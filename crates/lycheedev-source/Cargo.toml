[package]
name = "lycheedev-source"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[example]]
name = "emmy_xml_program"

[[example]]
name = "emmy_native_context_probe"

[[example]]
name = "emmy_source_input_probe"

[[example]]
name = "emmy_source_query_probe"

[[example]]
name = "emmy_source_control_probe"

[[example]]
name = "emmy_source_host_probe"

[[example]]
name = "emmy_source_host_execution_probe"

[[example]]
name = "emmy_source_flow_probe"

[dependencies]
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
lycheedev-core = { path = "../lycheedev-core" }
lycheedev-emmy-adapter = { path = "../lycheedev-emmy-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10.6"
quick-xml = "0.38"
tree-sitter = "=0.26.3"
tree-sitter-lua = "=0.5.0"
lycheedev-windows = { path = "../lycheedev-windows" }
# Unmodified public pinned upstream; enhancements live in our owned adapter.
# Build custody verifies third_party/emmy and every generated dependency byte.
emmylua_code_analysis = { path = "../../.tmp/emmy-reconstruction-v1/upstream/crates/emmylua_code_analysis", version = "=0.30.0" }
emmylua_parser = { path = "../../.tmp/emmy-reconstruction-v1/upstream/crates/emmylua_parser", version = "=0.30.0" }
rowan = { version = "=0.17.0" }
tokio-util = { version = "=0.7.19" }
